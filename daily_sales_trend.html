  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 24px; }
  h1 { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #888; margin-bottom: 20px; }

  /* KPI Cards */
  .kpi-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .kpi-card {
    background: #1a1d27; border-radius: 10px; padding: 14px 18px;
    flex: 1; min-width: 130px; border: 1px solid #2a2d3a;
  }
  .kpi-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .kpi-val { font-size: 20px; font-weight: 800; color: #fff; }

  /* Month Filter */

  .filter-label { font-size: 11px; color: #666; margin-right: 4px; }
  .month-btn {
    padding: 5px 14px; border-radius: 20px; border: 1px solid #2a2d3a;
    background: #1a1d27; color: #aaa; font-size: 12px; cursor: pointer;
    transition: all 0.15s;
  }
  .month-btn:hover { border-color: #4f8ef7; color: #4f8ef7; }
  .month-btn.active { background: #4f8ef7; border-color: #4f8ef7; color: #fff; font-weight: 700; }

  /* View Toggle */
  .view-toggle { display: flex; gap: 6px; margin-left: auto; }
  .view-btn {
    padding: 5px 12px; border-radius: 6px; border: 1px solid #2a2d3a;
    background: #1a1d27; color: #aaa; font-size: 11px; cursor: pointer;
    transition: all 0.15s;
  }
  .view-btn.active { background: #252836; border-color: #555; color: #fff; }

  /* Chart */
  .chart-wrap {
    background: #1a1d27; border-radius: 12px; border: 1px solid #2a2d3a;
    padding: 20px; margin-bottom: 16px;
  }
  .chart-wrap canvas { max-height: 340px; }

  /* Channel Legend */
  .legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 6px; border: 1px solid transparent; transition: all 0.15s; }
  .legend-item:hover { border-color: #333; background: #22252f; }
  .legend-item.hidden { opacity: 0.3; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { font-size: 11px; color: #ccc; }

  /* MA Toggle */
  .ma-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .ma-toggle label { font-size: 12px; color: #888; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .ma-toggle input[type=checkbox] { accent-color: #f5a623; width: 14px; height: 14px; cursor: pointer; }

  /* Tooltip custom */
  .chart-tooltip {
    position: absolute; background: #1e2130; border: 1px solid #333;
    border-radius: 8px; padding: 10px 14px; pointer-events: none;
    font-size: 12px; min-width: 180px; z-index: 99; display: none;
  }
</style>

i":63104,"TikTok":46100,"TikTok Live":0,"Facebook":38892,"Instagram":1618,"Shopee":52276,"Shopee Live":0,"Lazada":0,"YouTube":2360,"LINE":1589,"Web":290,"Shopify":0,"หน้าร้าน":0}];

const CH_COLORS = {
  'TikTok Affi':  '#fe2c55',
  'TikTok':       '#ff6b88',
  'TikTok Live':  '#ff9ab0',
  'Facebook':     '#4f8ef7',
  'Instagram':    '#c13584',
  'Shopee':       '#f96315',
  'Shopee Live':  '#ffaa7a',
  'Lazada':       '#0f146e',
  'YouTube':      '#ff0000',
  'LINE':         '#00b900',
  'Web':          '#888888',
  'Shopify':      '#95bf47',
  'หน้าร้าน':    '#9b59b6',
};
const CHANNELS = Object.keys(CH_COLORS);
const TOTAL_COLOR = '#4aeabc';
const MA_COLOR = '#f5a623';

let curMonth = 'all';
let curView = 'total';
let showMA = true;
let hiddenChannels = new Set();
let myChart = null;

function fmt(v) {
  if (v >= 1000000) return '฿' + (v/1000000).toFixed(2) + 'M';
  if (v >= 1000) return '฿' + Math.round(v/1000) + 'K';
  return '฿' + v;
}
function fmtFull(v) { return '฿' + v.toLocaleString('th-TH'); }

function getFiltered() {
  if (curMonth === 'all') return RAW;
  return RAW.filter(r => r.d.startsWith(curMonth));
}

function ma7(arr) {
  return arr.map((v, i) => {
    const slice = arr.slice(Math.max(0, i-6), i+1);
    return Math.round(slice.reduce((a,b)=>a+b,0)/slice.length);
  });
}

function updateKPI(data) {
  const totals = data.map(r=>r.total);
  const sum = totals.reduce((a,b)=>a+b,0);
  const avg = Math.round(sum/totals.length);
  const mx = Math.max(...totals);
  const mx_d = data[totals.indexOf(mx)].d;
  const mn = Math.min(...totals);
  const mn_d = data[totals.indexOf(mn)].d;
  const days = totals.length;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card"><div class="kpi-label">รวม (${days} วัน)</div><div class="kpi-val">${fmt(sum)}</div><div class="kpi-sub">${fmtFull(sum)}</div></div>
    <div class="kpi-card"><div class="kpi-label">เฉลี่ย/วัน</div><div class="kpi-val">${fmt(avg)}</div><div class="kpi-sub">${fmtFull(avg)}</div></div>
    <div class="kpi-card"><div class="kpi-label">สูงสุด</div><div class="kpi-val" style="color:#4aeabc">${fmt(mx)}</div><div class="kpi-sub">${mx_d}</div></div>
    <div class="kpi-card"><div class="kpi-label">ต่ำสุด</div><div class="kpi-val" style="color:#ff6b6b">${fmt(mn)}</div><div class="kpi-sub">${mn_d}</div></div>
  `;
}

function buildDatasets(data) {
  const labels = data.map(r => r.d.slice(5)); // MM-DD
  const totals = data.map(r => r.total);
  const maVals = ma7(totals);

  if (curView === 'total') {
    const ds = [{
      label: 'Total',
      data: totals,
      borderColor: TOTAL_COLOR,
      backgroundColor: TOTAL_COLOR + '15',
      borderWidth: 2,
      pointRadius: data.length > 31 ? 0 : 3,
      pointHoverRadius: 5,
      fill: true,
      tension: 0.3,
      type: 'line',
      order: 1,
    }];
    if (showMA) ds.push({
      label: '7d MA',
      data: maVals,
      borderColor: MA_COLOR,
      borderWidth: 2,
      borderDash: [5,3],
      pointRadius: 0,
      fill: false,
      tension: 0.4,
      type: 'line',
      order: 0,
    });
    return { labels, datasets: ds };
  }

  if (curView === 'channel') {
    const ds = CHANNELS.map(ch => ({
      label: ch,
      data: data.map(r => r[ch]),
      borderColor: CH_COLORS[ch],
      backgroundColor: CH_COLORS[ch] + '20',
      borderWidth: 1.5,
      pointRadius: 0,
      pointHoverRadius: 4,
      fill: false,
      tension: 0.3,
      type: 'line',
      hidden: hiddenChannels.has(ch),
    }));
    if (showMA) ds.push({
      label: '7d MA (Total)',
      data: maVals,
      borderColor: MA_COLOR,
      borderWidth: 2.5,
      borderDash: [6,3],
      pointRadius: 0,
      fill: false,
      tension: 0.4,
      type: 'line',
      hidden: false,
    });
    return { labels, datasets: ds };
  }

  if (curView === 'stack') {
    const ds = CHANNELS.map(ch => ({
      label: ch,
      data: data.map(r => r[ch]),
      backgroundColor: CH_COLORS[ch] + 'cc',
      borderColor: CH_COLORS[ch],
      borderWidth: 0.5,
      fill: true,
      tension: 0,
      type: 'bar',
      stack: 'total',
      hidden: hiddenChannels.has(ch),
    }));
    if (showMA) ds.push({
      label: '7d MA',
      data: maVals,
      borderColor: MA_COLOR,
      borderWidth: 2.5,
      borderDash: [6,3],
      pointRadius: 0,
      fill: false,
      tension: 0.4,
      type: 'line',
      stack: undefined,
      order: -1,
    });
    return { labels, datasets: ds };
  }
}

function buildLegend(data) {
  const row = document.getElementById('legendRow');
  if (curView === 'total') { row.innerHTML = ''; return; }
  row.innerHTML = CHANNELS.map(ch => {
    const total = data.reduce((a,r)=>a+r[ch],0);
    if (total === 0) return '';
    const hidden = hiddenChannels.has(ch);
    return `<div class="legend-item ${hidden?'hidden':''}" onclick="toggleChannel('${ch}')">
      <div class="legend-dot" style="background:${CH_COLORS[ch]}"></div>
      <span class="legend-name">${ch} <span style="color:#666;font-size:10px">${fmt(total)}</span></span>
    </div>`;
  }).join('');
}

function renderChart() {
  const data = getFiltered();
  updateKPI(data);
  const { labels, datasets } = buildDatasets(data);
  buildLegend(data);

  const isStack = curView === 'stack';
  const cfg = {
    data: { labels, datasets },
    options: {
      responsive: true,
      animation: { duration: 300 },
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: {
          grid: { color: '#1e2130' },
          ticks: {
            color: '#666',
            font: { size: 10 },
            maxTicksLimit: data.length > 31 ? 10 : 20,
          }
        },
        y: {
          stacked: isStack,
          grid: { color: '#1e2130' },
          ticks: {
            color: '#666',
            font: { size: 10 },
            callback: v => fmt(v),
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e2130',
          borderColor: '#333',
          borderWidth: 1,
          titleColor: '#fff',
          bodyColor: '#ccc',
          padding: 10,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmtFull(ctx.parsed.y)}`,
            footer: items => {
              if (curView === 'total') return '';
              const sum = items.filter(i=>i.dataset.label!=='7d MA (Total)'&&i.dataset.label!=='7d MA').reduce((a,i)=>a+i.parsed.y,0);
              return `รวม: ${fmtFull(sum)}`;
            }
          }
        }
      }
    }
  };

  if (myChart) {
    myChart.data = cfg.data;
    myChart.options = cfg.options;
    myChart.update();
  } else {
    myChart = new Chart(document.getElementById('myChart'), { type: 'line', ...cfg });
  }
}

function setMonth(m, btn) {
  curMonth = m;
  document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChart();
}

function setView(v) {
  curView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn' + v.charAt(0).toUpperCase() + v.slice(1)).classList.add('active');
  renderChart();
}

function toggleMA() {
  showMA = document.getElementById('maCheck').checked;
  renderChart();
}

function toggleChannel(ch) {
  if (hiddenChannels.has(ch)) hiddenChannels.delete(ch);
  else hiddenChannels.add(ch);
  renderChart();
}

renderChart();
</script>
